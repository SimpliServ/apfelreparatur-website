<!doctype html>
<html lang="de-AT">
<head>
<meta charset="utf-8" />
<style>
	* { box-sizing: border-box; margin: 0; }
	html, body { width: 1200px; height: 630px; overflow: hidden; }
	body {
		position: relative;
		font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
		-webkit-font-smoothing: antialiased;
		letter-spacing: -0.02em;
		background: #000;
		color: #f5f5f7;
	}
	body.light { background: #f5f5f7; color: #1d1d1f; }
	.photo { position: absolute; inset: 0 0 0 40%; background-size: cover; background-position: center; }
	.photo::after {
		content: ""; position: absolute; inset: 0;
		background: linear-gradient(90deg, #000 0%, rgba(0,0,0,.85) 20%, rgba(0,0,0,.35) 42%, transparent 62%);
	}
	.light .photo::after { background: linear-gradient(90deg, #f5f5f7 0%, rgba(245,245,247,.88) 20%, rgba(245,245,247,.35) 42%, transparent 62%); }
	.copy { position: absolute; left: 72px; top: 64px; bottom: 64px; width: 560px; display: flex; flex-direction: column; }
	.mark { font-size: 30px; font-weight: 400; }
	.mark b { font-weight: 600; }
	.eyebrow { margin-top: auto; font-size: 26px; font-weight: 600; color: #86868b; }
	.light .eyebrow { color: #6e6e73; }
	h1 { margin-top: 10px; font-size: 68px; line-height: 1.04; font-weight: 600; letter-spacing: -0.015em; }
	.sub { margin-top: 18px; font-size: 26px; line-height: 1.25; color: #a1a1a6; }
	.light .sub { color: #424245; }
	.pill {
		margin-top: 30px; align-self: flex-start; padding: 12px 24px; border-radius: 999px;
		background: #0071e3; color: #fff; font-size: 22px;
	}
</style>
</head>
<body>
	<div class="photo" id="photo"></div>
	<div class="copy">
		<p class="mark"><b>Apfel</b>reparatur</p>
		<p class="eyebrow" id="eyebrow"></p>
		<h1 id="title"></h1>
		<p class="sub" id="sub"></p>
		<p class="pill" id="pill"></p>
	</div>
	<script>
		function render(c) {
			document.body.className = c.light ? "light" : "";
			document.getElementById("photo").style.backgroundImage = "url(" + c.image + ")";
			for (const k of ["eyebrow", "title", "sub", "pill"]) {
				const el = document.getElementById(k);
				el.textContent = c[k] || "";
				el.style.display = c[k] ? "" : "none";
			}
			return document.fonts.ready.then(() => new Promise((r) => {
				const img = new Image();
				img.onload = img.onerror = () => r(true);
				img.src = c.image;
			}));
		}
	</script>
</body>
</html>
