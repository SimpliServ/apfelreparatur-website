<!doctype html>
<html lang="de-AT">
<head>
<meta charset="utf-8" />
<style>
	* { box-sizing: border-box; margin: 0; }
	html, body { width: 1200px; height: 630px; overflow: hidden; }
	body {
		position: relative;
		font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
		-webkit-font-smoothing: antialiased;
		letter-spacing: -0.02em;
		background: #f5f5f7;
		color: #1d1d1f;
	}
	/* Seamless shots share the page grey, so they sit on it whole; others get a rounded card like the page heroes. */
	.media { position: absolute; top: 48px; right: 48px; bottom: 48px; left: 624px; }
	.media img { width: 100%; height: 100%; display: block; }
	.photo img { object-fit: cover; border-radius: 28px; }
	.seamless { top: 0; right: 0; bottom: 0; left: 540px; }
	.seamless img { object-fit: cover; }
	.copy { position: absolute; left: 72px; top: 64px; bottom: 64px; width: 500px; display: flex; flex-direction: column; }
	.mark { height: 30px; width: auto; align-self: flex-start; }
	.eyebrow { margin-top: auto; font-size: 26px; font-weight: 600; color: #6e6e73; }
	h1 { margin-top: 10px; font-size: 66px; line-height: 1.04; font-weight: 600; letter-spacing: -0.015em; }
	.sub { margin-top: 18px; font-size: 26px; line-height: 1.25; color: #424245; }
	.pill {
		margin-top: 30px; align-self: flex-start; padding: 12px 24px; border-radius: 999px;
		background: #1d4ed8; color: #fff; font-size: 22px;
	}
</style>
</head>
<body>
	<div class="media" id="media"><img id="img" alt="" /></div>
	<div class="copy">
		<img class="mark" src="../../public/logo.svg" alt="Apfelreparatur" />
		<p class="eyebrow" id="eyebrow"></p>
		<h1 id="title"></h1>
		<p class="sub" id="sub"></p>
		<p class="pill" id="pill"></p>
	</div>
	<script>
		function render(c) {
			// Seamless photos are #f6f5f8 after webp encoding; match it so the photo edge disappears.
			document.body.style.background = c.seamless ? "#f6f5f8" : "";
			document.getElementById("media").className = "media " + (c.seamless ? "seamless" : "photo");
			for (const k of ["eyebrow", "title", "sub", "pill"]) {
				const el = document.getElementById(k);
				el.textContent = c[k] || "";
				el.style.display = c[k] ? "" : "none";
			}
			const img = document.getElementById("img");
			return document.fonts.ready.then(() => new Promise((r) => {
				img.onload = img.onerror = () => r(true);
				img.src = c.image;
			}));
		}
	</script>
</body>
</html>
